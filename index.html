<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Voorraadbeheer</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><link rel="icon" href="icon-192.png"></head><body><header><h1>Mijn voorraad</h1><button id="add" aria-label="Product toevoegen">＋</button><button id="settings" aria-label="Instellingen">⚙</button></header><main><div id="summary"></div><input id="search" type="search" placeholder="Zoek product…" aria-label="Zoek product"><nav><button id="all" class="active">Alle producten</button><button id="low">Bijbestellen</button></nav><table><thead><tr><th>Product</th><th>Kast</th><th>Tas</th><th>Totaal</th></tr></thead><tbody id="rows"></tbody></table><p id="empty"></p></main><dialog id="editor"><form id="edit"><h2 id="editTitle">Product bewerken</h2><label>Productnaam<input id="name" required maxlength="150"></label><label>Kleur productnaam<input id="color" type="color"></label><div class="pair"><label>In de kast<input id="kast" type="number" min="0" step="1" inputmode="numeric" placeholder="Onbekend"></label><label>In de tas<input id="tas" type="number" min="0" step="1" inputmode="numeric" placeholder="Onbekend"></label></div><button type="button" id="transfer">Van tas naar kast (+1)</button><label>Voorraadgrens<input id="grens" type="number" min="0" step="1" required inputmode="numeric"></label><small>Totaal wordt rood als het lager is dan deze grens.</small><p id="preview"></p><button class="primary" type="submit">Opslaan</button><button type="button" id="cancel">Annuleren</button><button type="button" id="remove" class="danger">Product verwijderen</button></form></dialog><dialog id="prefs"><h2>Instellingen</h2><p>Bewaar regelmatig een back-up. Je gegevens staan alleen op dit apparaat.</p><button id="export">Back-up exporteren</button><button id="import">Back-up importeren</button><input type="file" id="file" accept=".json,application/json" hidden><button id="closePrefs">Sluiten</button></dialog><script src="app.js"></script></body></html>
